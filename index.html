<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaijaPrice Tracker – Nigerian Commodity Price Forecasts</title>
    <meta
      name="description"
      content="Track Nigerian wholesale agricultural commodity prices, 12-month seasonality decomposition, and 3-to-12 month Ridge &amp; Holt-Winters forecasts."
    />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://naijaprice-tracker.app/price-forecast" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NaijaPrice" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- OpenGraph Social Card -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NaijaPrice Tracker" />
    <meta property="og:title" content="NaijaPrice Tracker – Nigerian Commodity Price Forecasts" />
    <meta
      property="og:description"
      content="Track Nigerian wholesale agricultural commodity prices, 12-month seasonality decomposition, and 3-to-12 month Ridge &amp; Holt-Winters forecasts."
    />
    <meta property="og:url" content="https://naijaprice-tracker.app/price-forecast" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="NaijaPrice Tracker — Nigerian agricultural commodity price trajectory and forecast card"
    />

    <!-- Twitter / X Social Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NaijaPrice Tracker – Nigerian Commodity Price Forecasts" />
    <meta
      name="twitter:description"
      content="Track Nigerian wholesale agricultural commodity prices, 12-month seasonality decomposition, and 3-to-12 month Ridge &amp; Holt-Winters forecasts."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="NaijaPrice Tracker — Nigerian agricultural commodity price trajectory and forecast card"
    />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script id="naijaprice-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NaijaPrice Tracker",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "All",
        "description": "Track Nigerian wholesale agricultural commodity prices, 12-month seasonality decomposition, and 3-to-12 month Ridge & Holt-Winters forecasts.",
        "image": "/og-image.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "NGN"
        }
      }
    </script>

    <!-- Prevent dark-mode flash on initial load -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("naijaprice_theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved === "dark" || (!saved && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-100 selection:text-emerald-900 dark:selection:bg-emerald-900/60 dark:selection:text-emerald-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
